<div class="main">
  <app-alerts></app-alerts>
  <!-- Loader Overlay - Until the data is loaded -->
  <div *ngIf="isLoading" class="loader-overlay">
    <div class="loader-spinner"></div>
  </div>
  <div class="centered-container" [class.loading-content]="isLoading">
    <div class="section">
      <div class="d-flex justify-content-end">
        <p class="dept-assign-note" *ngIf="departments?.length === 0">
          <i class="fa fa-exclamation-triangle"></i>
          Please create all required Departments before starting to create the Hierarchy.
        </p>
      </div>
      <!-- loader added here -->
      <button type="button" class="save_bt" style="float: right;"
        (click)="canAddSystemSettings && canReadSystemSettings ? createNewHierarchy() : null"
        [disabled]="!canAddSystemSettings || !canReadSystemSettings"
        *ngIf="!isLoading && (this.allhierarchyData === undefined || this.allhierarchyData === null)">
        Create New Hierarchy
      </button>
      <!-- loader added here  -->
      <div class="row mb-5"
        *ngIf="!isLoading && (this.allhierarchyData !== undefined && this.allhierarchyData !== null)">
        <div class="col-md-4 w-50">
          <div class="card h-100 text-center" style="margin-top: 5%;">
            <div class="card-header fw-bold"> {{ this.allhierarchyData.name ? this.allhierarchyData.name : 'Hierarchy'
              }}</div>
            <div class="card-body text-start">
              <button class="isViewBtn button w-100 py-1 my-1 fw-bold"
                (click)="canReadSystemSettings ? viewHierarchy(this.allhierarchyData.id) : null"
                [disabled]="!canReadSystemSettings">
                View Hierarchy
              </button>
              <button class="isChooseBtn button w-100 py-1 my-1 fw-bold"
                (click)="canEditSystemSettings ? getid(this.allhierarchyData.id) : null"
                [disabled]="!canEditSystemSettings">
                {{ this.allhierarchyData.name ? 'Edit Hierarchy Name' : 'Edit Hierarchy Name' }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Custom Modal -->
<div class="custom-modal" *ngIf="showModal">
  <div class="custom-modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Enter the Hierarchy name</h5>
      <button type="button" class="close" (click)="clearModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="text" class="form-control" [(ngModel)]="hierarchyName" placeholder="Enter the name"
        (input)="modalError = ''">
      <div *ngIf="modalError" class="error-msg">
        {{ modalError }}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-save" (click)="updateHierarchyData()">Save</button>
    </div>
  </div>
</div>
