<div class="main">
    <!-- <app-alerts></app-alerts> -->
    <div class="centered-container">
        <div class="container">
            <div class="section">
                <div class="add-btn-section">
                    <button class="add-btn submit"
                        style="font-size:14px; float: inline-end; margin-bottom: 20px; background: #800020; color: white; border-radius: 5px; border: 1px solid white; padding: 5px 20px;"
                        (click)="canAddRestaurants ? navigateToOutlet() : null" [disabled]="!canAddRestaurants">Add
                        Restaurant</button>
                </div>
                <!-- Loader -->
                <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center"
                    style="min-height: 400px;">
                    <div class="text-center">
                        <div class="spinner-border" role="status" style="color: #800020;">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3 text-muted">Loading outlets...</p>
                    </div>
                </div>
                <!-- Table -->
                <div class="table-responsive" *ngIf="!isLoading">
                    <div style="border: 1px solid #dee2e6; border-radius: 12px; overflow: hidden;">
                        <table class="table text-center align-middle mb-0">
                            <thead class="table-light">
                                <tr class="text-nowrap">
                                    <!-- <th class="text-start">S.No</th> -->
                                    <th class="text-start">Outlet Id</th>
                                    <th>Outlet Name</th>
                                    <th>Location</th>
                                    <th>Phone Number</th>
                                    <th>Menus</th>
                                    <!-- <th>View</th> -->
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let data of allOutletData; let i = index">
                                    <!-- <td class="text-start">{{ i + 1 }}.</td> -->
                                    <td class="text-start">
                                        {{data.id}}</td>
                                    <td>{{data.name}}</td>
                                    <td>{{data.location}}</td>
                                    <td>{{data.phone}}</td>
                                    <td>
                                        <i class="fa fa-eye view-icon" (click)="viewProducts(data.id)"
                                            title="View"></i>
                                        <!-- <img src="../../assets/images/guestezee/25px.png" (click)="viewProducts(data.id)"> -->
                                    </td>
                                    <td>
                                        <i class="fa fa-eye me-3 view-icon"
                                            (click)="canReadRestaurants ? viewOutlet(data.id) : null"
                                            [style.opacity]="canReadRestaurants ? 1 : 0.4"
                                            [style.cursor]="canReadRestaurants ? 'pointer' : 'not-allowed'"
                                            title="View"></i>
                                        <i class="fas fa-edit edit-icon"
                                            (click)="canEditRestaurants ? navigateById(data.id) : null"
                                            [style.opacity]="canEditRestaurants ? 1 : 0.4"
                                            [style.cursor]="canEditRestaurants ? 'pointer' : 'not-allowed'"
                                            title="Edit"></i>
                                    </td>
                                    <!-- <td>
                                        <i class="fas fa-edit edit-icon"
                                           (click)="canEditRestaurants ? navigateById(data.id) : null"
                                           [style.opacity]="canEditRestaurants ? 1 : 0.4"
                                           [style.cursor]="canEditRestaurants ? 'pointer' : 'not-allowed'"
                                           title="Edit"></i>
                                    </td> -->
                                </tr>
                                <tr *ngIf="allOutletData.length === 0">
                                    <td colspan="6" class="text-center">No outlets found</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Pagination -->
                <div class="pagination-container" *ngIf="!isLoading">
                    <button (click)="previousPage()" [disabled]="currentPage === 1" class="pagination-btn">
                        Previous
                    </button>
                    <input type="text" class="pagination-input" [(ngModel)]="currentPage" readonly>
                    <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="pagination-btn">
                        Next
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
