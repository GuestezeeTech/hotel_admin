<div class="main">
  <div class="centered-container">
    <form [formGroup]="serviceForm">
      <h3 class="form-title">
        {{ isViewMode ? 'View Service' : (service_id ? 'Edit Service' : 'Create Service') }}
      </h3>
      <!-- Basic Info -->
      <div class="form-grid">
        <div class="form-group form1_div">
          <label>Service Name</label>
          <input class="input_box" type="text" formControlName="service_name" [disabled]="isViewMode" />
        </div>
        <div class="form-group form1_div">
          <label>Department</label>
          <select class="input_box" formControlName="department" [disabled]="isViewMode">
            <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
          </select>
        </div>
      </div>
      <!-- Service Type + Belongs To -->
      <div class="form-grid">
        <div class="form-group form1_div">
          <label>Service Type</label>
          <select class="input_box" formControlName="service_type" [disabled]="isViewMode"
            (change)="selectedServiceType($event)">
            <option *ngFor="let type of serviceTypes" [value]="type">{{ type }}</option>
          </select>
        </div>
        <div class="form-group form1_div">
          <label>Belongs To</label>
          <input class="input_box" type="text" formControlName="belongs_to" [disabled]="isViewMode" />
        </div>
      </div>
      <!-- Description -->
      <div class="form-group form1_div">
        <label>Description</label>
        <textarea class="form-control input_box" formControlName="description" rows="4" [disabled]="isViewMode"
          placeholder="Enter description" style="font-size: 14px;"></textarea>
      </div>
      <!-- Upload Sections -->
      <div class="form-grid">
        <!-- ICON Upload -->
        <div class="form-group form1_div">
          <div class="custom-file-upload" [ngClass]="{ 'disabled-upload': isViewMode }">
            <input type="file" #iconInput formControlName="icon" accept="image/*" (change)="logoupload($event)"
              [disabled]="isViewMode" />
            <label class="upload-label">
              <div class="file-preview">
                <div class="icon-tag">ICON</div>
                <div>
                  <div class="file-name" *ngIf="!logo_image" [class.disabled-text]="isViewMode">Choose file...</div>
                  <div class="file-name" *ngIf="logo_image" [class.disabled-text]="isViewMode">Uploaded</div>
                </div>
              </div>
              <div class="upload-actions">
                <i class="fas fa-trash-alt" [class.disabled-icon]="isViewMode"
                  (click)="!isViewMode && deleteIcon()"></i>
                <a [href]="logo_image" target="_blank" [class.disabled-icon]="isViewMode">
                  <i class="fas fa-eye" [class.disabled-icon]="isViewMode"></i>
                </a>
                <i class="fas fa-upload" [class.disabled-icon]="isViewMode" (click)="!isViewMode && openLogofile()"></i>
              </div>
            </label>
          </div>
        </div>
        <!-- IMAGE Upload -->
        <div class="form-group form1_div">
          <div class="custom-file-upload" [ngClass]="{ 'disabled-upload': isViewMode }">
            <input type="file" #imageInput formControlName="image" accept="image/*" (change)="imageupload($event)"
              [disabled]="isViewMode" />
            <label class="upload-label">
              <div class="file-preview">
                <div class="icon-tag">IMAGE</div>
                <div>
                  <div class="file-name" *ngIf="!service_image" [class.disabled-text]="isViewMode">Choose file...</div>
                  <div class="file-name" *ngIf="service_image" [class.disabled-text]="isViewMode">Uploaded</div>
                </div>
              </div>
              <div class="upload-actions">
                <i class="fas fa-trash-alt" [class.disabled-icon]="isViewMode"
                  (click)="!isViewMode && deleteImage()"></i>
                <a [href]="service_image" target="_blank" [class.disabled-icon]="isViewMode">
                  <i class="fas fa-eye" [class.disabled-icon]="isViewMode"></i>
                </a>
                <i class="fas fa-upload" [class.disabled-icon]="isViewMode" (click)="!isViewMode && openImagefile()"></i>
              </div>
            </label>
          </div>
        </div>
      </div>
      <!-- Quantity Section -->
      <div class="toggle-section">
        <h5>Quantity</h5>
        <label class="switch">
          <input type="checkbox" formControlName="quantity" (change)="toggleChanged($event)" [disabled]="isViewMode" />
          <span class="slider round"></span>
        </label>
        <div class="form-grid" *ngIf="quantityEnabled">
          <div class="form-group form1_div">
            <label>Minimum Quantity</label>
            <input class="input_box" type="text" formControlName="minimum_quantity" [disabled]="isViewMode" />
          </div>
          <div class="form-group form1_div">
            <label>Maximum Quantity</label>
            <input class="input_box" type="text" formControlName="maximum_quantity" [disabled]="isViewMode" />
          </div>
        </div>
      </div>
      <!-- Time Bound Section -->
      <div class="toggle-section">
        <h5>Time Bound</h5>
        <label class="switch">
          <input type="checkbox" formControlName="is_time_bound" (change)="toggleTimeBound($event)"
            [disabled]="isViewMode" />
          <span class="slider round"></span>
        </label>
        <div class="form-grid" *ngIf="timeBoundEnabled">
          <div class="form-group form1_div">
            <label>Minutes</label>
            <input class="input_box" type="text" formControlName="time_bound_value" [disabled]="isViewMode" />
          </div>
        </div>
      </div>
      <!-- Active Toggle -->
      <div class="form-grid">
        <div class="toggle-section">
          <h5>Active</h5>
          <label class="switch">
            <input type="checkbox" formControlName="is_active" [disabled]="isViewMode" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <!-- Buttons -->
      <div class="form-actions">
        <button type="button" class="back_bt" (click)="openBackModal()">
          Back
        </button>
        <button type="button" class="save_bt" (click)="saveDta()" [disabled]="isViewMode">
          Save
        </button>
      </div>
    </form>
  </div>
  <!-- Custom Confirmation Modal -->
  <div *ngIf="showBackModal"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center;">
    <div
      style="background: white; padding: 30px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);">
      <!-- Confirmation Text -->
      <h2 style="margin-bottom: 8%; font-size: 20px; font-weight: bold;">Are you sure you want to exit?</h2>
      <!-- Buttons: Cancel and Confirm -->
      <div style="display: flex; justify-content: space-around;">
        <button
          style="padding: 10px; background: #E1E2EB; color: black; border: none; cursor: pointer; width: 40%; border-radius: 8px;"
          (click)="closeBackModal()">
          Cancel
        </button>
        <button
          style="padding: 10px; background: #800020; color: white; border: none; cursor: pointer; width: 40%; border-radius: 8px;"
          (click)="navigateBack()">
          Exit
        </button>
      </div>
    </div>
  </div>
</div>
