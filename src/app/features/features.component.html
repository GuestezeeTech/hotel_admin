                <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <i class="fa-solid fa-door-open me-3" style="font-size: 16px; color:#800020"></i>
                        <div>
                            <h6 class="mb-1 fw-bold">Restaurants</h6>
                            <p class="mb-0 fw-medium small">Manage restaurants, menus, and offers.</p>

                    <i class="bi bi-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>
</div>
