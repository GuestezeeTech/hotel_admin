<div class="main">
  <div class="centered-container">
    <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="home-tab">
      <table class="table">
        <thead>
          <tr>
            <th>Plan</th>
            <th>Payment Date</th>
            <th>Payment Amount</th>
            <th>Subscription Period</th>
            <th>Invoice</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let inst of paidInstallments">
            <td>{{ inst.name }}</td>
            <td>{{ inst.paid_date_time | date: 'dd-MM-yyyy' }}</td>
            <td>{{ inst.order_total_amount }}</td>
            <td>{{ inst.subscription_end_date }}</td>
            <td class="gold"><i class="fa-regular fa-file-lines"></i></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
