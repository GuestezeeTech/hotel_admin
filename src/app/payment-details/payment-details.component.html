]<div class="main">
  <div class="centered-container">
    <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="home-tab">
      <table class="table">
        <thead>
          <tr>
            <th>Order Id</th>
            <th>Plan</th>
            <th>Payment Date</th>
            <th>Payment Amount</th>
            <th>Subscription Period</th>
            <th>Invoice</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="!paidInstallments || paidInstallments.length === 0">
            <td colspan="6" class="text-center text-muted">No Payments made</td>
          </tr>
          <tr *ngFor="let inst of paidInstallments">
            <td>{{ inst.orderId }}</td>
            <td>{{ inst.name }}</td>
            <td>{{ inst.paid_date_time | date: 'dd-MM-yyyy' }}</td>
            <td>{{ inst.order_total_amount | currency:'INR' }}</td>
            <td>{{ inst.subscription_end_date }}</td>
            <td class="gold"><i class="fa-regular fa-file-lines" style="color: #800020; cursor: pointer;" (click)="downloadInvoice(inst.orderId)"></i></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
