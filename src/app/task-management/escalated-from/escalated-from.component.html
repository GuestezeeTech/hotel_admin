

<table class="escalated-from-table table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Room No</th>
            <th>Service</th>
            <th>Department</th>
            <th>Order Time</th>
            <th>Escalate Time</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let task of escalatedTasks">
            <td (click)="navigateToTimeline(task.id)" style="cursor: pointer;"
                [ngClass]=" task.countingUp ? 'escalated' : ''">{{ task.guest_name }}</td>
            <td [ngClass]=" task.countingUp ? 'escalated' : ''">{{ task.room_no }}</td>
            <td [ngClass]=" task.countingUp ? 'escalated' : ''">{{ task.service.service_name }}</td>
            <td [ngClass]=" task.countingUp ? 'escalated' : ''">{{ task.service.category }}</td>
            <td [ngClass]=" task.countingUp ? 'escalated' : ''">{{ task.order_time }}</td>
            <!-- <td [ngClass]="getEscalateStyles(task)">
                {{ formatSeconds(escalateSecondsMap.get(task.name) || 0) }}
            </td> -->
             <!-- <td [ngClass]=" task.countingUp ? 'escalated' : ''">{{(escalateSecondsMap.get(task.guest_name) || 0)}}</td> -->
            <td [ngClass]=" task.countingUp ? 'escalated' : ''">{{ task.remainingSeconds }}</td>
            <td [ngClass]=" task.countingUp ? 'escalated' : ''">
                <button  [ngClass]=" task.countingUp ? 'escalated' : 'not-escalated'"
                    style="color: #545460; border: none !important; cursor: pointer; text-decoration: underline;"
                    (click)="onAddAssignee(task)">
                    Add Assignee
                </button>
            </td>
        </tr>
    </tbody>
</table>
