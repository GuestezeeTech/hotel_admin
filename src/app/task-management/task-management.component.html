<div class="main">
    <app-alerts></app-alerts>
    <div class="centered-container">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <!-- Tabs -->
                <div class="d-flex gap-2">
                    <div class="d-flex" style="border-radius: 10px; background-color: #EAEAEA;">
                        <ng-container *ngFor="let tab of tabs">
                            <button *ngIf="shouldDisplayTab(tab)" class="btn tab-btn py-1 shadow-none"
                                [ngClass]="{ 'active': selectedTab === tab }" (click)="selectTab(tab)">
                                <!-- Newly added - Escalation -->
                                <ng-container *ngIf="tab === 'My Escalation'">
                                    My Escalation <span class="badge bg-danger ms-1" *ngIf="escalatedCount > 0">{{
                                        escalatedCount }}</span>

                                </ng-container>
                                <ng-container *ngIf="tab === 'Staff Escalation'">
                                    Staff Escalation <span class="badge bg-danger ms-1"
                                        *ngIf="staffEscalatedComponent > 0">{{
                                        staffEscalatedComponent }}</span>
                                </ng-container>
                                <ng-container *ngIf="tab === 'Priority'">
                                    Priority <span class="badge bg-danger ms-1" *ngIf="priorityEscalatedCount > 0">{{
                                        priorityEscalatedCount }}</span>
                                </ng-container>
                                <ng-container
                                    *ngIf="((tab !== 'Staff Escalation') && ( tab !== 'My Escalation') && (tab !== 'Priority'))">
                                    {{ tab }}
                                </ng-container>
                            </button>
                        </ng-container>
                        <!-- <ng-container *ngFor="let tab of tabs">
                            <button *ngIf="shouldDisplayTab(tab)" class="btn tab-btn px-3 py-1 shadow-none"
                                [ngClass]="{ 'active': selectedTab === tab }" (click)="selectTab(tab)">
                                {{ tab }}
                            </button>
                        </ng-container> -->
                    </div>
                    <button class="btn btn-outline-secondary" style="background-color: #EAEAEA; color: #800020"
                        (click)="refreshTabData()">
                        <i class="fas fa-sync-alt me-1"></i>
                    </button>
                </div>
                <!-- Search Bar with Filter -->
                <div class="d-flex align-items-center"
                    style="border-radius: 10px; box-shadow: 0 0 5px rgba(0, 0, 0, 0.2); width: 12%">
                    <!-- <span class="px-1">
                        <i class="fas fa-search" style="color: gray; font-size: 15px;"></i>
                    </span> -->
                    <input type="text" placeholder="Room no" class="form-control border-0 bg-white"  [(ngModel)]="roomSearchTerm" (input)="onRoomSearchChange()"
                        style="box-shadow: none; color: black; font-size: 14px;">
                    <span class="px-2">
                        <i class="fas fa-search" style="color: gray; font-size: 15px;"></i>
                    </span>
                    <!-- <div class="px-2 py-2" (click)="toggleFilterDropdown()"
                        style="background-color: #D8D8D8;  border-top-right-radius: 10px; border-bottom-right-radius: 10px; cursor: pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="black" class="bi bi-funnel"
                            viewBox="0 0 16 16">
                            <path
                                d="M1.5 1.5a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 .4.8L10 8.118V13.5a.5.5 0 0 1-.757.429l-2-1.2A.5.5 0 0 1 7 12.3V8.118L1.1 1.8a.5.5 0 0 1 .4-.8z" />
                        </svg>
                    </div> -->
                    <!-- Dropdown Popup -->
                    <div *ngIf="showFilterDropdown" class="position-absolute mt-2 shadow-sm"
                        style="background: white; padding: 12px 16px; border-radius: 10px; z-index: 1000; min-width: 10%; right: 4%; top: 21%">
                        <!-- Triangle Arrow -->
                        <div
                            style="position: absolute; top: -10px; right: 12px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 10px solid white;">
                        </div>
                        <!-- Escalated -->
                        <div class="d-flex align-items-center mb-2" style="cursor: pointer;">
                            <i class="fas fa-briefcase me-2" style="font-size: 14px;"></i>
                            <span style="font-weight: 500; font-size: 14px;">Escalated</span>
                        </div>
                        <!-- Pending -->
                        <div class="d-flex align-items-center" style="cursor: pointer;">
                            <i class="fas fa-clock me-2" style="font-size: 14px;"></i>
                            <span style="font-weight: 500; font-size: 14px;">Pending</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Component Loader Based on Value -->
            <app-asap-cart *ngIf="selectedTab === 'ASAP'" (openAssigneeModal)="openModal($event)"
                (escalatedCountChanged)="updateEscalatedCount($event)" #asapCart1></app-asap-cart>
            <app-escalated-from *ngIf="selectedTab === 'Priority'" (openAssigneeModal)="openModal($event)"
                #highPriority></app-escalated-from>
            <app-processing *ngIf="selectedTab === 'Processing'" #processing></app-processing>
            <app-scheduled *ngIf="selectedTab === 'Schedule'" (openAssigneeModal)="openModal($event)"
                #scheduled></app-scheduled>
            <app-delivered *ngIf="selectedTab === 'Delivered'" #delivered></app-delivered>
            <!-- Newly added - Completed -->
            <app-staff-delivered *ngIf="selectedTab === 'Staff Delivered'" #staff_delivered></app-staff-delivered>
            <!-- Newly added  - Escalation-->
            <app-escalated *ngIf="selectedTab === 'My Escalation'" #escalated></app-escalated>
            <app-staff-escalation *ngIf="selectedTab === 'Staff Escalation'" #staffEscalated></app-staff-escalation>
            <app-cancelled *ngIf="selectedTab === 'Cancelled'" #cancelled></app-cancelled>
            <!-- Centered Modal Overlay -->
            <div class="d-flex justify-content-center align-items-center staff-modal" *ngIf="isModalOpen"
                style="height: 100vh; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;">
                <!-- Modal Box -->
                <div class="bg-white p-4 rounded" style="width: 35%; border-radius: 20px;">
                    <!-- Modal Title -->
                    <h5 class="fw-bold mb-4" style="font-size:18px;">Add Assignee to Room No: {{ selectedRoom }}</h5>
                    <!-- Select Assignee Title -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <p class="fw-bold mb-0" style="font-size: 14px;">Select Assignee</p>
                        <!-- <span class="fw-bold" style="color: #800020;">
                            {{ getAssignableCount() }}/<span style="color: #1A1A1A;">{{ getTotalStaffCount() }}</span>
                        </span> -->
                    </div>
                    <!-- Assignee Buttons -->
                    <div class="rounded p-3 d-flex flex-wrap gap-2" style="border: 1px dashed #D5D5D5;">
                        <!-- Show message if no staff -->
                        <div *ngIf="staves.length === 0" class="text-muted fw-semibold" style="font-size: 13px;">
                            Currently no staff available
                        </div>
                        <!-- Show staff list if available -->
                        <span *ngFor="let staff of staves" class="px-2 py-1 rounded" style="font-size: 13px"
                            (click)="selectStaff(staff)" [ngStyle]="getCompleteStaffStyle(staff)">
                            {{ staff.full_name }}
                        </span>
                    </div>
                    <!-- Buttons -->
                    <div class="mt-4" *ngIf="staves.length > 0; else noStaffActions">
                        <button class="btn fw-bold w-100 mb-2 shadow-none"
                            style="background-color: #800020; color: white;" [disabled]="!isStaffSelected"
                            (click)="assignDuty()">Assign
                            Duty</button>
                        <button class="btn w-100 shadow-none" style="background-color: #C4C4C4; color: white;"
                            (click)="closeModal()">Cancel</button>
                    </div>
                    <ng-template #noStaffActions>
                        <button class="btn w-100 shadow-none mt-4" style="background-color: #800020; color: white;"
                            (click)="closeModal()">
                            Okay
                        </button>
                    </ng-template>
                </div>
            </div>
            <!-- Already Assigned Modal - Task update modal -->
            <div class="d-flex justify-content-center align-items-center staff-modal" *ngIf="taskUpdateModal"
                style="height: 100vh; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; width: 100%; z-index: 10000;">
                <div class="bg-white p-3 rounded" style="width: 30%; border-radius: 20px; text-align: center;">
                    <!-- Modal Title -->
                    <h5 class="fw-bold mb-3" style="font-size: 18px; color: #800020;">
                        Task Already Assigned
                    </h5>
                    <!-- Assigned Info -->
                    <p class="mb-3" style="font-size: 16px; color: #545460;">
                        This task is already assigned to
                        <span class="fw-bold">{{ assigningTask?.assigned_staff_name }}</span>.
                    </p>
                    <!-- Okay Button -->
                    <button class="btn w-25 shadow-none" style="background-color: #800020; color: white;"
                        (click)="closeTaskUpdatedModal()">
                        Okay
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
