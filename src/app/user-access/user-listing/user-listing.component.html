<div class="main">
    <app-alerts></app-alerts>
    <div class="centered-container">
        <div class="container user">
            <!-- Tabs Navigation -->
            <div style="display: flex; justify-content: space-between;">
                <button class="fw-semibold" (click)="openDeleteModal()"
                    style="background-color: #800020;font-weight: 500;color: white; padding: 10px 20px; border-radius: 5px; font-size: 14px; border: none;"
                    [disabled]="!canDeleteUserAccess">
                    Delete Selected
                </button>
                <button class="fw-semibold"
                    style="background-color: #800020; color: white; padding: 10px 20px; border-radius: 5px; font-size: 14px; border: none;"
                    (click)="toggleAddUser()" [disabled]="!canAddUserAccess">
                    Add User
                </button>
            </div>
            <!-- User Table -->
            <table class="table" style="margin-top: 3%;">
                <thead>
                    <tr>
                        <th style="text-align: center;">
                            <input type="checkbox" disabled>
                        </th>
                        <th>Type</th>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Role / Position</th>
                        <!-- <th>Last Login</th> -->
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Login users first, then all the hotel's staff -->
                    <tr *ngFor="let row of pagedRows" style="background-color: white;">
                        <td>
                            <!-- Delete Selected removes login users only; staff are deleted on the Staff page -->
                            <input type="checkbox" *ngIf="row.kind === 'user'" [value]="row.name"
                                [checked]="selectedUserIds.includes(row.id)"
                                (change)="toggleSelection($event, row.id)" style="cursor: pointer;"
                                [disabled]="!canDeleteUserAccess">
                            <input type="checkbox" *ngIf="row.kind === 'staff'" disabled
                                title="Delete staff from the Staff page">
                        </td>
                        <td>
                            <span class="row-type" [class.is-staff]="row.kind === 'staff'">
                                {{ row.kind === 'staff' ? 'Staff' : 'User' }}
                            </span>
                        </td>
                        <td>{{ row.email || '-' }}</td>
                        <td>
                            {{ row.name || '-' }}
                            <small *ngIf="row.employeeId" class="text-muted d-block">ID: {{ row.employeeId }}</small>
                        </td>
                        <td>{{ row.role || '-' }}</td>
                        <!-- <td>{{ user.lastLogin }}</td> -->
                        <td>
                            <!-- View icon: requires read permission -->
                            <i class="fa fa-eye me-3" style="color: #800020; cursor: pointer;"
                                [style.opacity]="canReadUserAccess ? 1 : 0.4" (click)="viewRow(row)"
                                [style.cursor]="canReadUserAccess ? 'pointer' : 'not-allowed'" title="View"></i>
                            <!-- Edit icon: requires edit permission -->
                            <i class="fa fa-pen-to-square" style="color: #800020; cursor: pointer;"
                                [style.opacity]="canEditUserAccess ? 1 : 0.4" (click)="editRow(row)"
                                [style.cursor]="canEditUserAccess ? 'pointer' : 'not-allowed'" title="Edit"></i>
                        </td>
                    </tr>
                    <tr *ngIf="rows.length === 0">
                        <td colspan="6" class="text-center">No users or staff found</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination-container">
                <button (click)="previousPage()" [disabled]="currentPage === 1" class="pagination-btn">
                    Previous
                </button>
                <input type="text" class="pagination-input" [(ngModel)]="currentPage" readonly>
                <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="pagination-btn">
                    Next
                </button>
            </div>
        </div>
    </div>
</div>
<!-- Confirmation Modal for Deleting -->
<div *ngIf="isDeleteModalOpen"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center;">
    <div
        style="background: white; padding: 30px; border-radius: 15px; width: 450px; text-align: center; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);">
        <!-- Confirmation Text -->
        <h2 style="margin-bottom: 10px; font-size: 20px; font-weight: bold;">Are you sure you want to delete?</h2>
        <!-- Warning Text (optional) -->
        <p style="font-size: 16px; margin-bottom: 20px;">This action cannot be undone.</p>
        <!-- Buttons: Cancel and Confirm -->
        <div style="display: flex; justify-content: space-around;">
            <button
                style="padding: 12px; background: #E1E2EB; color: black; border: none; cursor: pointer; width: 45%; border-radius: 8px;"
                (click)="closeDeleteModal()">
                Cancel
            </button>
            <button
                style="padding: 12px; background: #800020; color: white; border: none; cursor: pointer; width: 45%; border-radius: 8px;"
                (click)="deleteSelectedUsers()">
                Delete
            </button>
        </div>
    </div>
</div>
