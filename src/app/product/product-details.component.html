<div  class="main">
<div [formGroup]="companyForm" class="company-details-form">
  <!-- List of products section -->
  <div class="section" *ngIf="this.newProduct">
    <div class="add-btn-section">
      <button class="add-btn submit" (click)="addProduct1()">Add Menu</button>
    </div>
    <div class="container mt-4">
      <!-- <app-alerts></app-alerts> -->
      <div class="row" *ngIf="allProducts?.length">
        <div class="col-md-3 mb-4" *ngFor="let product of allProducts; let i = index">
          <div class="card h-100 shadow-sm product-card">
            <div class="d-flex justify-content-between">
              <div class="product-price">
                <span class="price sale-tag">₹{{ product.pricing?.raw?.price }}</span>
              </div>
              <div class="product-actions">
                <i class="fa fa-edit me-2 cursor-pointer" (click)="editProduct(product.id)"></i>
                <i class="fa fa-trash cursor-pointer" (click)="deleteProduct(product.id)"></i>
              </div>
            </div>
            <div class="product-image mt-2">
              <!-- Image -->
              <img [src]="product.assets[0]?.image_source || this.defaultImageUrl"
                class="card-img product-image" alt="Product Image" />
            </div>
            <!-- Product Name -->
            <div class="card-body text-center">
              <h5 class="card-title product-name">{{ product.name }}</h5>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="section" *ngIf="!this.newProduct">
    <!-- Upload Product Images -->
    <div class="upload-section">
      <div style="width: 55%; border-right: 1.5px solid #e7e7e7; padding-right: 20px;">
        <h3 style="font-family: 'montsmed'; font-size: 16px;">
          UPLOAD IMAGES
        </h3>
        <div class="upload-box" style="display: grid;">
          <i class="fa fa-file-arrow-up"
            style="-webkit-text-fill-color: white; -webkit-text-stroke: 1px #883a01; font-size: 25px;"></i>
          <div style="display: flex; justify-content: center;">
            <button class="upload-btn" (click)="triggerFileInput()" [disabled]="isUploading">
              <ng-container *ngIf="!isUploading">
                Upload {{ uploadedFiles[currentStage].name }}
              </ng-container>
              <ng-container *ngIf="isUploading">
                <i class="fa fa-spinner fa-spin"></i> Uploading...
              </ng-container>
            </button>
            <input type="file" #fileInput (change)="onFileUpload($event)" hidden>
          </div>
          <p style="font-family: 'montsreg'; font-size: 9px; color: #777777;">Maximum file size 2MB</p>
        </div>
      </div>
      <div class="file-list">
        <div class="file-item" *ngFor="let file of uploadedFiles; let i = index;">
          <div>
            <span class="file-name" style="font-family: 'montsmed'; font-size: 12px; color: #0a0a0a;">
              Upload {{ file.name }} - {{ file.fileName || 'No file uploaded' }}
            </span>
            <p class="file-size" style="font-family: 'montsreg'; font-size: 10px; color: #848484;">
              Maximum File size • 2MB
            </p>
          </div>
          <div class="file-actions">
            <i class="fa fa-eye" [style.opacity]="file.fileUrl ? '1' : '0.5'"
              [style.pointerEvents]="file.fileUrl ? 'auto' : 'none'"
              style="-webkit-text-fill-color: white; -webkit-text-stroke: 1px #39c97c; font-size: 10px;"
              (click)="openImageModal(file.fileUrl)">
            </i>
            <i class="fa fa-upload"
              style="-webkit-text-fill-color: white; -webkit-text-stroke: 1px #883a01; font-size: 10px;"
              (click)="triggerFileInput1(fileInput)">
            </i>
            <!-- File Input (Hidden) -->
            <input type="file" #fileInput (change)="onIndividualFileUpload($event, i)" hidden>
            <i class="fa fa-trash"
              style="-webkit-text-fill-color: white; -webkit-text-stroke: 1px #888888; font-size: 10px;"
              (click)="removeFile(i)"></i>
            <!-- <i class="fa fa-upload" style="-webkit-text-fill-color: white; -webkit-text-stroke: 1px #883a01; font-size: 10px;"></i> -->
          </div>
        </div>
      </div>
    </div>
    <div class="modal-overlay" *ngIf="isModalOpen" (click)="closeModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <button (click)="closeModal()" class="close-btn">X</button>
        <img [src]="selectedImageUrl" alt="Document Preview" class="modal-image">
      </div>
    </div>
  </div>

  <!-- Product Details -->
  <section class="section products" *ngIf="!this.newProduct">
    <div style="display: flex;justify-content: space-between;">
      <h2 style="font-family: 'montsmed'; font-size: 16px;">MENU DETAILS</h2>
      <button class="submit" (click)="opencate()">Add Category</button>
    </div>
    <div class="form-row">
      <div class="form-group" [formGroup]="categoryForm">
        <label style="font-family: 'montsreg'; font-size: 13px;">Category <span class="required">*</span>
        </label>
        <select class="form-control" formControlName="selectedCategory" (change)="onCategoryChange($event)">
          <option *ngFor="let category of categories" [ngValue]="category">
            {{ category.name }}
          </option>
          <option [ngValue]="'othercat'">Other Category</option>
        </select>
      </div>
      <div class="form-group">
        <label style="font-family: 'montsreg';font-size: 13px;">Item <span class="required">*</span>
        </label>
        <input type="text" formControlName="name" placeholder="Machine" class="custom-input" />
      </div>
    </div>
    <div class="form-row">
      <!-- <div class="form-group">
        <label style="font-family: 'montsreg';font-size: 13px;">SKU ID <span class="required">*</span>
        </label>
        <input type="text" formControlName="sku" placeholder="SKU-9085" class="custom-input" />
      </div> -->
      <div class="form-group">
        <label style="font-family: 'montsreg';font-size: 13px;">Price <span class="required">*</span>
        </label>
        <input type="text" formControlName="price" placeholder="$400" class="custom-input" />
      </div>
      <div class="form-group">
        <label style="font-family: 'montsreg';font-size: 13px;">Offer Price <span class="required">*</span>
        </label>
        <input type="text" formControlName="offer_price" placeholder="$200" class="custom-input" />
      </div>
    </div>
    <!-- [(ngModel)]="isAvailable" -->
    <div class="form-group">
      <label style="font-family: 'montsreg';font-size: 13px;">Description
      </label>
      <textarea rows="5" formControlName="description" class="custom-input"></textarea>
    </div>
  </section>

  <!-- Product Availability -->
  <section class="section availability" *ngIf="!this.newProduct">
    <h2 style="font-family: 'montsmed'; font-size: 16px;">ITEM AVAILABILITY</h2>
    <span class="label-text">Available</span>
    <label class="switch">
      <input type="checkbox" [checked]="isAvailable" (change)="toggleAvailability($event)" />
      <span class="slider round"></span>
    </label>
  </section>

  <!-- Add Category section -->
  <div [formGroup]="categoryForm" class="modal-overlay1" *ngIf="isModalOpen1" (click)="closeModal1()">
    <div class="modal-content1" (click)="$event.stopPropagation()">
      <div style="display: flex;">
        <img src="../../assets/images/cle/categorylog.png">
        <h2 style="font-family: 'montsmed'; font-size: 16px;text-align: left;">Category :</h2>
      </div>
      <p style="font-family: 'montsmed'; font-size: 14px;text-align: left;">Enter Category <span
          class="required">*</span></p>
      <input type="text" formControlName="name" placeholder="Category" class="custom-input1" />
      <div class="form-actions category-btn-actions">
        <button type="button" class="cancel1" (click)="closeModal1()">Cancel</button>
        <button type="button" class="submit1" (click)="createcat()">Save</button>
      </div>
    </div>
  </div>

  <!-- Submit and Cancel Buttons -->
  <div class="form-actions" *ngIf="!this.newProduct">
    <button type="button" class="cancel" (click)="cancelProduct()">Cancel</button>
    <button type="submit" class="submit" (click)="onSubmit()"
      [disabled]="!companyForm.valid || !categoryForm.valid ">Save</button>
  </div>
</div>
</div>
