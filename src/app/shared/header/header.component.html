<header class="header">
  <div class="menu-name">
    <h1>
      <img src="assets/images/guestezee/menu.png" alt="Menu Icon" />
      <span>{{ activeMenu }}</span>
    </h1>
  </div>
  <!-- User Info Section -->
  <div class="user-info">
    <img
      class="notification-icon"
      src="assets/images/guestezee/notify.png"
      alt="Notification"
      (click)="toggleNotification()"
      *ngIf="customerType == 'Staff'"
    />
    <button
      #accountToggle
      type="button"
      class="account-toggle"
      (click)="toggleLogout($event)"
      [attr.aria-expanded]="showAccount"
      aria-haspopup="menu"
      aria-label="Account menu"
    >
      <img
        [src]="profile_image"
        alt=""
        class="profile-icon"
      />
      <span class="username">{{ profile_name }}</span>
      <i class="bi bi-chevron-down account-chevron" aria-hidden="true"></i>
    </button>
  </div>
  <div
    #accountDropdown
    *ngIf="showAccount"
    class="profile-settings"
    role="menu"
  >
    <button type="button" class="profile-menu-item" role="menuitem" (click)="navigateToProfile()">
      <i class="fas fa-user-circle" aria-hidden="true"></i>
      <span>Profile</span>
    </button>
    <button type="button" class="profile-menu-item" role="menuitem" (click)="logout()">
      <i class="fas fa-power-off" aria-hidden="true"></i>
      <span>Logout</span>
    </button>
  </div>
</header>
<!-- <app-notification *ngIf="showNotification" (close)="toggleNotification()"></app-notification> -->
<!-- <app-notification *ngIf="showNotification" [notifications]="notifications"
  (close)="toggleNotification()"></app-notification> -->
<app-notification *ngIf="showNotification  && customerType === 'Staff'"
  (close)="toggleNotification()"></app-notification>
<!-- <app-notification *ngIf="showNotification" [notifications]="notifications"
  (close)="toggleNotification()"></app-notification> -->
<!-- Newly commented for Payment modal -->
<div class="modal fade" #paymentModal tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="background-color:white;">
      <div class="modal-header">
        <h4 class="modal-title" style="color:#800020;">Payment Type</h4>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <div *ngFor="let item of paymentoptions; let i = index" style="padding:2px;">
          <input type="radio" [checked]="selectedIndex===i" (change)="selectOnlyOne(i)"> {{item}}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" style="color:#800020;background:white;border:2px solid #8b1633;"
          (click)="closeModal()">Close</button>
        <button type="button" class="btn btn-danger" style="color:white;background:#800020;"
          (click)="executePayment()">Pay</button>
      </div>
    </div>
  </div>
</div>
