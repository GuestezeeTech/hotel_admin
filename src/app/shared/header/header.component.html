<header class="header">
  <div class="menu-name">
    <h1 style="color:black; font-size: 20px;">
      <!--newly commented and added-->
      <!-- <img src="assets/images/guestezee/menu.png" alt="Menu Icon">&nbsp;&nbsp;{{selectedMenu }} --> 
      <img src="assets/images/guestezee/menu.png" alt="Menu Icon">&nbsp;&nbsp;{{activeMenu}}
    </h1>
  </div>
  <!-- User Info Section -->
  <div class="user-info d-flex align-items-center">
    <img class="notification-icon" src="assets/images/guestezee/notify.png" alt="Notification"
      (click)="toggleNotification()" *ngIf="(this.customerType=='Staff')">
    <div #accountToggle (click)="toggleLogout($event)" style="cursor: pointer;">
      <img [src]="profile_image" alt="Profile" class="profile-icon border mr-2"
        style="width: 35px; height: 35px; object-fit: contain; background-color: #ffffff; border-radius: 4px;">
      <span class="username d-none d-md-inline">{{profile_name}}</span>
        <i class="bi bi-chevron-down" style="color:black; font-size: 12px; margin-left:3px;"></i>
      <!-- Display username only on medium screens and larger -->
    </div>
  </div>
  <div #accountDropdown *ngIf="showAccount" class="position-absolute profile-settings border rounded-3 shadow-sm  mt-2"
    style="top: 70%; right: 1.5%; width: 10%; background-color: #fff;    z-index: 1000;">
    <button class="btn d-flex align-items-center shadow-none border-0 pt-2 ps-2 pe-3" (click)="navigateToProfile()">
      <i class="fas fa-user-circle me-2" style="color: #800020; font-size: 15px;"></i>
      <span style="font-size: 15px; font-weight: 600;">Profile</span>
    </button>
    <button class="btn d-flex align-items-center shadow-none border-0  ps-2 pe-3" (click)="logout()">
      <i class="fas fa-power-off me-2" style="color: #800020; font-size: 14px;"></i>
      <span style="font-size: 15px; font-weight: 600;">Logout</span>
    </button>
  </div>
</header>
<!-- <app-notification *ngIf="showNotification" (close)="toggleNotification()"></app-notification> -->
<!-- <app-notification *ngIf="showNotification" [notifications]="notifications"
  (close)="toggleNotification()"></app-notification> -->
<app-notification *ngIf="showNotification  && customerType === 'Staff'"
  (close)="toggleNotification()"></app-notification>
<!-- <app-notification *ngIf="showNotification" [notifications]="notifications"
  (close)="toggleNotification()"></app-notification> -->
<!-- Newly commented for Payment modal -->
<div class="modal fade" #paymentModal tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="background-color:white;">
      <div class="modal-header">
        <h4 class="modal-title" style="color:#800020;">Payment Type</h4>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <div *ngFor="let item of paymentoptions; let i = index" style="padding:2px;">
          <input type="radio" [checked]="selectedIndex===i" (change)="selectOnlyOne(i)"> {{item}}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" style="color:#800020;background:white;border:2px solid #8b1633;"
          (click)="closeModal()">Close</button>
        <button type="button" class="btn btn-danger" style="color:white;background:#800020;"
          (click)="executePayment()">Pay</button>
      </div>
    </div>
  </div>
</div>
