<div class="sidenav">

  <div class="logo-container">
    <img [src]="hotelLogoUrl || 'https://ecbee-labes-images1.s3.ap-south-1.amazonaws.com/Guestezee/Brand/no+logo.png'"
      alt="Hotel Logo" class="sidebar-logo" />
  </div>

  <hr style="width: 80%;" class="center-hr" />
  <ul style="padding: 6px 6px 6px 10px;">
    <!-- Dashboard -->
    <!--     <li class="list_container" [class.active]="isActive('dashboard')"
      (click)="setActiveMenu('dashboard'); sendValue('Dashboard')"
      *ngIf="(customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('DASHBOARD'))">
      <img src="../../assets/images/guestezee/layout.png" alt="Dashboard">
      <a routerLink="/dashboard">Dashboard</a>
    </li> -->
    <li class="list_container" [class.active]="isActive('dashboard')"
      (click)="setActiveMenu('dashboard'); sendValue('Dashboard')" routerLink="/dashboard"
      *ngIf="customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('DASHBOARD')">
      <img src="../../assets/images/guestezee/layout.png" alt="Dashboard">
      <span>Dashboard</span>
    </li>
    <!-- Task Management -->
    <!-- <li class="list_container" [class.active]="isActive('task')"
      (click)="setActiveMenu('task'); sendValue('Task Management')"
      *ngIf="((customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('TASK MANAGEMENT')) || (customerType=='Staff'))">
      <img src="../../assets/images/guestezee/taskManagement.png" alt="Task Management">
      <a routerLink="/task-management">Task Management</a>
    </li> -->
    <li class="list_container" [class.active]="isActive('task')" [routerLink]="['/task-management']"
      (click)="setActiveMenu('task'); sendValue('Task Management')"
      *ngIf="((customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('TASK MANAGEMENT')) || customerType == 'Staff')">
      <img src="../../assets/images/guestezee/taskManagement.png" alt="Task Management">
      <span>Task Management</span>

    </li>
    <!-- Hotels -->
    <li class="list_container" [class.active]="isActive('hotel')"
      *ngIf="(customerType === 'Customer' && hasAnyPermission('HOTELS'))" (click)="toggleSubmenu('Hotels')">
      <div class="list-content">
        <div class="left-content">
          <img src="../../assets/images/guestezee/hotel (2).png" alt="Hotels">
          <span>Hotels</span>
        </div>
        <i class="fas fa-chevron-down dropdown-icon" [ngClass]="{ 'rotate': isHotelSubmenuOpen }"
          *ngIf="(customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('HOTELS')) "></i>
      </div>
    </li>
    <!-- Hotel submenu -->
    <li class="sub-menu"
      *ngIf="isHotelSubmenuOpen && (customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('HOTELS'))">
      <div class="submenu">
        <!-- Old: (click)="setActiveMenu('hotel-0'); goToTab('Registered Office Details')" -->
        <span class="submenu-item" [class.active]="isActive('hotel-0')"
          (click)="setActiveMenu('hotel-0'); navigateToHotelTab(0)">Office Details</span>
        <!-- Old: (click)="setActiveMenu('hotel-1'); goToTab('Property Details')" -->
        <span class="submenu-item" [class.active]="isActive('hotel-1')"
          (click)="setActiveMenu('hotel-1'); navigateToHotelTab(1)">Property Details</span>
        <!-- <span class="submenu-item" [class.active]="isActive('hotel-2')"
          (click)="setActiveMenu('hotel-2'); goToTab('Services')">Services</span> -->
        <!-- <span class="submenu-item" [class.active]="isActive('hotel-3')"
          (click)="setActiveMenu('hotel-3'); goToTab('Hierarchy')">Hierarchy</span> -->
        <!-- Old: (click)="setActiveMenu('hotel-4'); goToTab('Technical Info')" -->
        <span class="submenu-item" [class.active]="isActive('hotel-4')"
          (click)="setActiveMenu('hotel-4'); navigateToHotelTab(2)">Technical Info</span>
      </div>
    </li>
    <!-- Bookings -->
    <!--  <li class="list_container" [class.active]="isActive('bookings')"
      (click)="setActiveMenu('bookings'); sendValue('Bookings')"
      *ngIf="(customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('BOOKINGS'))">
      <img src="../../assets/images/guestezee/bookings.png" alt="Bookings">
      <a routerLink="/bookings">Bookings</a>
    </li> -->
    <li class="list_container" [class.active]="isActive('bookings')" [routerLink]="['/bookings']"
      (click)="setActiveMenu('bookings'); sendValue('Bookings')"
      *ngIf="customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('BOOKINGS')">
      <img src="../../assets/images/guestezee/bookings.png" alt="Bookings">
      <span>Bookings</span>

    </li>
    <li class="list_container" [class.active]="isActive('guests')" [routerLink]="['/guests-list']"
      (click)="setActiveMenu('guests'); sendValue('Guests')"
      *ngIf="customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('GUESTS')">
      <div class="list-content">
        <div class="left-content">
          <i class="fas fa-users" style="color: white; font-size: 16px; margin-right: 2px;"></i>
          <span>Guests</span>
        </div>
      </div>
    </li>
    <!-- User Access -->
    <li class="list_container" [class.active]="isActive('user-access')" (click)="toggleSubmenu('User Access')"
      *ngIf="(customerType === 'Customer' &&customerdata?.status=='approved' && hasAnyPermission('USER ACCESS'))">
      <div class="list-content">
        <div class="left-content">
          <img src="../../assets/images/guestezee/secure-access (1).png" alt="User Access" />
          <a>User Access</a>
        </div>
        <i class="fas fa-chevron-down dropdown-icon" [ngClass]="{ 'rotate': isUserAccessSubmenuOpen }"></i>
      </div>
    </li>
    <!-- User Access submenu -->
    <li class="sub-menu"
      *ngIf="isUserAccessSubmenuOpen && (customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('USER ACCESS'))">
      <div class="submenu">
        <a class="submenu-item" routerLink="/role-list" [class.active]="isActive('role')"
          (click)="setActiveMenu('role'); sendValue('Roles')">Roles</a>
        <a class="submenu-item" routerLink="/user-list" [class.active]="isActive('user')"
          (click)="setActiveMenu('user'); sendValue('Users')">Users</a>
        <a class="submenu-item" routerLink="/staff-list" [class.active]="isActive('staff')"
          (click)="setActiveMenu('staff'); sendValue('Staff')">Staff</a>
      </div>
    </li>
    <!-- Settings -->
    <li class="list_container" [class.active]="isActive('settings-main')" (click)="toggleSubmenu('Settings')"
      *ngIf="(customerType === 'Staff' || (customerType === 'Customer' && hasAnyPermission('SYSTEM SETTINGS')))">
      <div class="list-content">
        <div class="left-content">
          <img src="../../assets/images/guestezee/setting.png" alt="Settings" />
          <a>System Settings</a>
        </div>
        <i class="fas fa-chevron-down dropdown-icon" [ngClass]="{ 'rotate': isSettingsSubmenuOpen }"></i>
      </div>
    </li>
    <li class="sub-menu"
      *ngIf="isSettingsSubmenuOpen && (customerType === 'Staff' || (customerType === 'Customer' && hasAnyPermission('SYSTEM SETTINGS')))">
      <div class="submenu">
        <a class="submenu-item" routerLink="/settings" [class.active]="isActive('settings-page')"
          (click)="setActiveMenu('settings-page'); sendValue('Settings')"
          *ngIf="customerType === 'Customer' || customerType === 'Staff'">Settings</a>
        <!-- Newly added for dynamic department -->
        <a class="submenu-item" routerLink="/department-list" [class.active]="isActive('department')"
          (click)="setActiveMenu('department'); sendValue('Department')"
          *ngIf="customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('SYSTEM SETTINGS')">Department</a>
        <!-- Newly added for service -->
        <a class="submenu-item" routerLink="/service-tab-list" [class.active]="isActive('service-tab')"
          (click)="setActiveMenu('service-tab'); sendValue('Service Tab')"
          *ngIf="customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('SYSTEM SETTINGS')">Service
          Tab</a>
        <a class="submenu-item" routerLink="/service-list" [class.active]="isActive('service')"
          (click)="setActiveMenu('service'); sendValue('Service')"
          *ngIf="customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('SYSTEM SETTINGS')">Service</a>
        <a class="submenu-item" routerLink="/member-hierarchy" [class.active]="isActive('hierarchy')"
          (click)="setActiveMenu('hierarchy'); sendValue('Hierarchy')"
          *ngIf="customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('SYSTEM SETTINGS')">Hierarchy</a>
      </div>
    </li>
    <!-- Features -->
    <!--    <li class="list_container" [class.active]="isActive('features')"
      (click)="setActiveMenu('features'); sendValue('Features')"
      *ngIf="(customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('FEATURES'))">
      <img src="https://ecbee-labes-images1.s3.ap-south-1.amazonaws.com/GuestEzee/undefined/feature1.png"
        alt="Features">
      <a routerLink="/features">Features (Upselling)</a>
    </li> -->
    <li class="list_container" [class.active]="isActive('features')" [routerLink]="['/features']"
      (click)="setActiveMenu('features'); sendValue('Features')"
      *ngIf="customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('FEATURES')">
      <img src="https://ecbee-labes-images1.s3.ap-south-1.amazonaws.com/GuestEzee/undefined/feature1.png"
        alt="Features">
      <span>Features (Upselling)</span>
    </li>
    <!-- Payment -->
    <!--   <li class="list_container" [class.active]="isActive('payment')"
      (click)="setActiveMenu('payment'); sendValue('Payment')"
      *ngIf="(customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('PAYMENT'))">
      <img src="../../assets/images/guestezee/check.png" alt="Payment">
      <a routerLink="/payment-details">Payment</a>
    </li> -->
    <!-- Payment -->
    <li class="list_container" [class.active]="isActive('payment')" [routerLink]="['/payment-details']"
      (click)="setActiveMenu('payment'); sendValue('Payment')"
      *ngIf="customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('PAYMENT')">
      <img src="../../assets/images/guestezee/check.png" alt="Payment">
      <span>Payment</span>
    </li>
    <!-- Outlet -->
    <!-- <li class="list_container" [class.active]="isActive('outlet')"
      (click)="setActiveMenu('outlet'); sendValue('Outlet')"
      *ngIf="(customerType === 'Customer' && customerdata?.status=='approved' && hasAnyPermission('OUTLETS'))">
      <div class="list-content">
        <div class="left-content">
          <i class="fas fa-store" style="color: white;"></i>
          <a routerLink="/outlet-list">Outlets</a>
        </div>
      </div>
    </li> -->
    <li class="list_container" [class.active]="isActive('outlet')" [routerLink]="['/outlet-list']"
      (click)="setActiveMenu('outlet'); sendValue('Outlet')"
      *ngIf="customerType === 'Customer' && customerdata?.status == 'approved' && hasAnyPermission('OUTLETS')">
      <div class="list-content">
        <div class="left-content">
          <i class="fas fa-store" style="color: white;"></i>
          <span>Outlets</span>
        </div>
      </div>
    </li>
  </ul>
</div>
