  <!-- new modal  -->
  <div class="modal" id="techInfoUpdate">
    <div class="modal-dialog">
      <div class="modal-content">
        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title">{{selectedTechInfo}}</h4>
          <button type="button" class="btn-close" data-dismiss="modal" id="closetechInfo"></button>
        </div>
        <!-- Modal body -->
        <div class="modal-body">
          <app-edit-technical-info [infoData]="selectedTechInfo"></app-edit-technical-info>
        </div>
        <!-- Modal footer -->

  <!--  Newly added & commented for Payment modal -->
  <!-- component template -->
  <div class="modal fade" #paymentModal tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" style="background-color:white;">
        <div class="modal-header">
          <h4 class="modal-title" style="color:#800020;">Payment Type</h4>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div *ngFor="let item of paymentoptions; let i = index" style="padding:2px;">
            <input type="radio" [checked]="selectedIndex===i" (change)="selectOnlyOne(i)"> {{item}}
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" style="color:#800020;background:white;border:2px solid #8b1633;"
            (click)="closeModal()">Close</button>
          <button type="button" class="btn btn-danger" style="color:white;background:#800020;"
            (click)="executePayment()">Pay</button>
        </div>
      </div>
    </div>
  </div>
