<app-alerts></app-alerts>
<!-- Newly added for hierarchy edit -->
<div style="margin-top: 2%;" *ngIf="!isHierarchyExists">
  <p style="color: #800020; font-weight: bold;">
    NOTE : You can edit the hierarchy once it has been selected and saved.
  </p>
</div>
<div class="section">
  <div class="row row-cols-1 row-cols-md-3 g-5 mb-5">
    <div class="col" *ngFor="let hierarchy of hierarchies">
      <div class="card h-100 text-center" [ngClass]="{
       'active-border': setActiveId === hierarchy.id,
       'isSelected': hierarchy.customer_id == hotelId,
       'isNotSelected': hierarchy.customer_id != hotelId || hierarchy.customer_id == undefined
     }">
        <div class="card-header fw-bold" id=`{{hierarchy?.name}}`>{{ hierarchy?.name || hierarchy.customer_hierarchy?.name
          || ' '}} </div>
        <div class="card-body text-start">
          <button class="isViewBtn button w-100 py-1 my-1 fw-bold"
            (click)="onViewHierarchy(hierarchy.id, hierarchy.customer_id)">
            View Hierarchy
          </button>
          <!-- Condition for choose button  --> <!--Newly added - paymentDone for disabling button-->
          <button class="isChooseBtn button w-100 py-1 my-1 fw-bold" (click)="chooseHierarchy(hierarchy)"
            [disabled]="disableButtonFn(hierarchy) || paymentDone">
            Choose Hierarchy
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div style="display: flex; justify-content: flex-end; margin-top: 20px;">
  <button type="button" class="cancel_bt" (click)="back()">Back</button>&nbsp;&nbsp;
  <button *ngIf="!paymentDone" type="button" class="save_bt" (click)="save()">Save & Continue</button>
</div>
