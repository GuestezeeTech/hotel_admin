<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- <title>GUESTEZEE HOTEL REGISTRATION</title> -->
  <title>GUESTEZEE ADMIN</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome (Latest) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <!-- jQuery (Full Version) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" type="image/png" href="assets/images/guestezee/logo1.png">
  <!-- Initialize Bootstrap Tooltips & Popovers -->
  <script>
    $(document).ready(function () {
      $('[data-toggle="tooltip"]').tooltip();
      $('[data-toggle="popover"]').popover();
    });
  </script>
</head>

<body>
  <app-root>
    <!-- Premium Loader shown before Angular bootstraps -->
    <style>
      .app-bootstrap-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #fbfafb;
        z-index: 999999;
      }

      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid #800020;
        border-top-color: transparent;
        border-radius: 50%;
        animation: loaderSpin 0.8s linear infinite;
      }

      @keyframes loaderSpin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="app-bootstrap-loader">
      <div class="loader-spinner"></div>
    </div>
  </app-root>
</body>

</html>
